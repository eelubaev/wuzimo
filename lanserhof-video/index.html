<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Lanserhof Tegernsee — KZ</title>
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/300.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/300-italic.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/400-italic.css">
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Lanserhof Tegernsee — Kazakh concept spot. Every frame is computed from time alone: window.seek(t). */
const W = 1920, H = 1080, DUR = 84;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const bufs = [mk(), mk()], bufC = mk(), bufL = mk(), bufS = mk(480, 270);

const SERIF = '"Cormorant Garamond", Georgia, serif', SANS = 'Inter, "DejaVu Sans", sans-serif';
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const C = { cream: '#F2EDE4', gold: '#C9B48A', ink: '#0C1210', soft: 'rgba(242,237,228,0.72)', dim: 'rgba(242,237,228,0.45)' };

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eo = t => 1 - Math.pow(1 - clamp(t), 4);
const mixc = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(seed) { const r = rng(seed), p = []; for (let i = 0; i < 1024; i++) p.push(r()); return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(p[i & 1023], p[(i + 1) & 1023], u); }; }
const fbm = (n, x, o = 5) => { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * n(x * f); f *= 2.03; a *= .5; } return s; };
const ridged = (n, x, o = 5) => { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * (1 - Math.abs(2 * n(x * f) - 1)); f *= 2.07; a *= .5; } return s; };
const NZ = [makeNoise(11), makeNoise(23), makeNoise(37), makeNoise(51), makeNoise(67)];

/* ---------- text ---------- */
function txt(c, s, x, y, o = {}) {
  c.save();
  c.globalAlpha *= (o.alpha ?? 1);
  c.font = `${o.italic ? 'italic ' : ''}${o.weight || 300} ${o.size || 40}px ${o.font || SERIF}`;
  c.fillStyle = o.color || C.cream; c.textAlign = o.align || 'left'; c.textBaseline = 'alphabetic';
  c.letterSpacing = (o.track || 0) + 'px';
  if (o.shadow) { c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = o.shadow; }
  c.fillText(s, x, y); c.restore();
}
// fade/slide in at t0, out at t1
function rev(c, s, x, y, o, t, t0, t1 = 1e9, d = 1.1) {
  const p = eo((t - t0) / d), q = 1 - ss(t1 - .6, t1, t);
  if (p <= 0 || q <= 0) return;
  txt(c, s, x, y + (1 - p) * 16, { ...o, alpha: (o.alpha ?? 1) * p * q });
}
function line(c, x1, y1, x2, y2, col, a = 1, w = 1) { c.save(); c.globalAlpha *= a; c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.restore(); }
function wrap(c, s, maxW, font) { c.save(); c.font = font; const words = s.split(' '), out = []; let cur = ''; for (const w of words) { const tst = cur ? cur + ' ' + w : w; if (c.measureText(tst).width > maxW && cur) { out.push(cur); cur = w; } else cur = tst; } if (cur) out.push(cur); c.restore(); return out; }

/* ---------- precomputed textures ---------- */
const mist = mk(2600, 600);
(() => { const m = mist.getContext('2d'), r = rng(5); for (let i = 0; i < 140; i++) { const x = 200 + r() * 2200, y = 240 + r() * 120, rad = 80 + r() * 150; const g = m.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(1, 'rgba(255,255,255,0)'); m.fillStyle = g; m.fillRect(x - rad, y - rad, rad * 2, rad * 2); } })();
const grains = [0, 1, 2, 3].map(k => { const g = mk(640, 360), gc = g.getContext('2d'), im = gc.createImageData(640, 360), r = rng(100 + k); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } gc.putImageData(im, 0, 0); return g; });
const vign = mk(); (() => { const v = vign.getContext('2d'), g = v.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)'); v.fillStyle = g; v.fillRect(0, 0, W, H); })();
const TREES = (() => { const r = rng(77), a = []; for (let i = 0; i < 150; i++) { const x = -200 + r() * 2400; if (x > 1090 && x < 1700 && r() < .85) continue; a.push({ x, h: 26 + r() * 44, j: r() }); } return a.sort((p, q) => p.h - q.h); })();
const FAR_TREES = (() => { const r = rng(91), a = []; for (let i = 0; i < 260; i++) a.push({ x: -300 + r() * 2600, h: 8 + r() * 12 }); return a; })();

/* ---------- landscape (Bavarian Alps, lake, resort on the hill) ---------- */
const SKY = { m: ['#5C7E98', '#C6D2D2', '#F2DFC0'].map(hx), d: ['#2A3452', '#BC8B78', '#F6B67C'].map(hx) };
const HY = H * 0.585, LB = H * 0.735;
const hillY = x => H * 0.735 + 0.05 * H * Math.sin(x * 0.0019 + 0.9) + 0.03 * H * (fbm(NZ[3], x * 0.003, 3) - .5) - 0.075 * H * Math.exp(-Math.pow((x - 1390) / 520, 2));
function conifer(c, x, y, h, col, n = 3) { const w = h * (n > 3 ? .26 : .36); c.fillStyle = col; c.beginPath(); for (let k = 0; k < n; k++) { const f = k / n, ty = y - h * f * .82, tw = w * (1 - f * .85), th = h * (n > 3 ? .26 : .55); c.moveTo(x - tw, ty); c.quadraticCurveTo(x - tw * .4, ty - th * .35, x, ty - th - (k === n - 1 ? h * .1 : 0)); c.quadraticCurveTo(x + tw * .4, ty - th * .35, x + tw, ty); } c.fill(); c.fillRect(x - h * .015, y - 2, h * .03, h * .1); }
function ridgePath(c, f, x0, x1, step) { c.beginPath(); c.moveTo(x0, H * 1.2); for (let x = x0; x <= x1; x += step) c.lineTo(x, f(x)); c.lineTo(x1, H * 1.2); c.closePath(); }

function land(c, o) {
  const tod = o.tod, sk = [0, 1, 2].map(i => mixc(SKY.m[i], SKY.d[i], tod));
  const z = o.zoom || 1, fx = o.fx || 0, fy = o.fy || 0, pan = o.pan || 0, t = o.t || 0;
  c.save();
  c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-W / 2 - fx, -H / 2 - fy);
  const X0 = -600, X1 = W + 600;
  // sky
  let g = c.createLinearGradient(0, -300, 0, HY); g.addColorStop(0, rgba(sk[0])); g.addColorStop(.62, rgba(sk[1])); g.addColorStop(1, rgba(sk[2]));
  c.fillStyle = g; c.fillRect(X0, -900, X1 - X0, HY + 910);
  const sx = W * .70 - pan * .02, sy = HY - 150 + tod * 60;
  g = c.createRadialGradient(sx, sy, 0, sx, sy, 760); g.addColorStop(0, rgba(mixc(sk[2], [255, 248, 230], .6), .8 + .2 * tod)); g.addColorStop(.25, rgba(sk[2], .28)); g.addColorStop(1, rgba(sk[2], 0));
  c.fillStyle = g; c.fillRect(X0, -900, X1 - X0, HY + 910);
  // mountains
  const L = [
    { f: x => HY - H * .52 * ridged(NZ[0], (x + pan * .05) * .0016 + 3.1), col: mixc(sk[1], [110, 126, 146], .45), snow: .70 },
    { f: x => HY - H * .30 * ridged(NZ[1], (x + pan * .12) * .0025 + 7.7) + 10, col: mixc(sk[1], [66, 84, 92], .66), snow: .84 },
    { f: x => HY - H * .11 * fbm(NZ[2], (x + pan * .25) * .0042 + 1.3) + 6, col: mixc(sk[1], [36, 54, 47], .84) },
  ];
  const drawMtn = (lay, alpha = 1) => {
    c.save(); c.globalAlpha *= alpha;
    ridgePath(c, lay.f, X0, X1, 5); const mg = c.createLinearGradient(0, HY - H * .5, 0, HY); mg.addColorStop(0, rgba(mixc(lay.col, mixc(sk[2], [255, 250, 240], .5), .28))); mg.addColorStop(1, rgba(mixc(lay.col, [20, 30, 28], .12))); c.fillStyle = mg; c.fill();
    if (lay.snow) { // snow band on high peaks
      c.beginPath(); const pts = [];
      for (let x = X0; x <= X1; x += 5) { const y = lay.f(x), hn = (HY - y) / (H * .5); pts.push([x, y, Math.min(46, Math.max(0, hn - lay.snow) * 230)]); }
      c.moveTo(pts[0][0], pts[0][1]); for (const p of pts) c.lineTo(p[0], p[1]); for (let i = pts.length - 1; i >= 0; i--) c.lineTo(pts[i][0], pts[i][1] + pts[i][2]);
      c.closePath(); c.fillStyle = rgba(mixc([248, 246, 242], sk[2], .2 + tod * .35), .78); c.fill();
    }
    c.restore();
  };
  const haze = a => { const hg = c.createLinearGradient(0, HY - H * .32, 0, HY); hg.addColorStop(0, rgba(sk[1], 0)); hg.addColorStop(1, rgba(sk[2], a)); c.fillStyle = hg; c.fillRect(X0, HY - H * .32, X1 - X0, H * .32 + 2); };
  drawMtn(L[0]); haze(.42); drawMtn(L[1]); haze(.30);
  drawMtn(L[2]);
  for (const tr of FAR_TREES) { const x = tr.x + pan * .25 * 0; const y = L[2].f(tr.x); conifer(c, tr.x, y + 4, tr.h, rgba(mixc(L[2].col, [20, 32, 28], .35))); }
  haze(.12);
  // lake + reflections
  g = c.createLinearGradient(0, HY, 0, LB); g.addColorStop(0, rgba(mixc(sk[2], sk[1], .4))); g.addColorStop(1, rgba(mixc(sk[0], [14, 24, 26], .55)));
  c.fillStyle = g; c.fillRect(X0, HY, X1 - X0, LB - HY + 200);
  c.save(); c.beginPath(); c.rect(X0, HY, X1 - X0, LB - HY + 200); c.clip();
  c.translate(0, 2 * HY); c.scale(1, -1);
  drawMtn(L[0], .22); drawMtn(L[1], .26); drawMtn(L[2], .42);
  c.restore();
  c.save(); const rr = rng(3);
  for (let i = 0; i < 90; i++) { const p = Math.pow(rr(), 1.4), y = HY + 4 + p * (LB - HY), x = X0 + rr() * (X1 - X0), w = 30 + rr() * 180 * (1 - p * .5); const fl = .5 + .5 * Math.sin(t * (0.8 + rr() * 1.4) + i); c.globalAlpha = (.05 + .12 * (1 - p)) * fl; c.fillStyle = rgba(mixc(sk[2], [255, 255, 255], .4)); c.fillRect(x + Math.sin(t * .3 + i) * 20, y, w, 1.4 + p * 1.6); }
  c.restore();
  // low mist over the lake
  c.save(); c.globalAlpha = (o.mist ?? .6); const mo = ((t * 14 + pan * .3) % 1300 + 1300) % 1300; c.drawImage(mist, -mo - 600, HY - 330); c.drawImage(mist, -mo + 1700, HY - 330); c.restore();
  // foreground hill (golf meadow) with resort
  c.save(); c.translate(pan * .35, 0);
  const mead = mixc(hx('#7E9667'), hx('#596443'), tod);
  ridgePath(c, hillY, X0 - 400, X1 + 400, 8);
  g = c.createLinearGradient(0, H * .62, 0, H); g.addColorStop(0, rgba(mead)); g.addColorStop(1, rgba(mixc(mead, [24, 34, 26], .75))); c.fillStyle = g; c.fill();
  c.save(); ridgePath(c, hillY, X0 - 400, X1 + 400, 8); c.clip();
  for (let k = 0; k < 5; k++) { const ex = 300 + k * 420, ey = hillY(ex) + 60 + k % 2 * 40; c.fillStyle = rgba(mixc(mead, [190, 205, 150], .5), .16); c.beginPath(); c.ellipse(ex, ey, 260, 34, -.05, 0, 7); c.fill(); }
  c.restore();
  if ((o.resort ?? 1) > 0) resort(c, o.resort ?? 1, tod, mead);
  for (const tr of TREES) { const y = hillY(tr.x) + 6; conifer(c, tr.x, y, tr.h, rgba(mixc(mixc(mead, [18, 30, 22], .78), sk[1], .1))); }
  c.restore();
  // foreground framing trees (strongest parallax)
  c.save(); c.translate(pan * .9, 0);
  const fr = rng(41), fcol = rgba(mixc([16, 24, 20], sk[0], .08));
  if ((o.fg ?? 1) > 0) for (let i = 0; i < 7; i++) { const left = i < 3, x = left ? -260 + fr() * 300 : W + 60 - fr() * 300, hh = 380 + fr() * 300; conifer(c, x, H + 40, hh, fcol, 10); }
  c.restore();
  c.restore();
}
function resort(c, a, tod, mead) {
  const bx = 1150, bw = 470, by = hillY(1390) + 2;
  c.save(); c.globalAlpha *= a;
  const fac = mixc(hx('#E3DDD0'), hx('#B7A792'), tod * .7), glass = mixc(hx('#33403F'), hx('#1E2626'), tod), warm = '#FFCB86';
  c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(bx + bw / 2, by + 6, bw * .62, 12, 0, 0, 7); c.fill();
  const slab = (x, y, w, h) => { c.fillStyle = rgba(fac); c.fillRect(x, y - h, w, h * .28); c.fillStyle = rgba(glass); c.fillRect(x + 4, y - h * .72, w - 8, h * .58); c.fillStyle = rgba(fac); c.fillRect(x, y - h * .14, w, h * .14);
    for (let i = 0; i < w / 14; i++) { const wx = x + 8 + i * 14; c.globalAlpha = a * (.04 + .96 * tod * tod) * (.5 + .5 * ((i * 7) % 5 > 1)); c.fillStyle = warm; c.fillRect(wx, y - h * .66, 8, h * .46); } c.globalAlpha = a; };
  slab(bx, by, bw, 30); slab(bx + 70, by - 30, bw - 150, 26); slab(bx + 150, by - 56, bw - 300, 22);
  c.fillStyle = rgba(mixc(fac, [255, 255, 255], .3)); c.fillRect(bx - 6, by - 31, bw + 12, 2); c.fillRect(bx + 64, by - 57, bw - 138, 2);
  // glass pavilion
  const px = 1690, py = hillY(1720) + 2; c.fillStyle = rgba(glass, .9); c.fillRect(px, py - 24, 64, 24); c.fillStyle = rgba(fac); c.fillRect(px - 4, py - 27, 72, 3);
  c.globalAlpha = a * (.2 + .8 * tod); c.fillStyle = warm; c.fillRect(px + 6, py - 20, 52, 14);
  c.restore();
}

/* ---------- scenes ---------- */
function legibility(c, side = 'left', a = .55) { const g = side === 'left' ? c.createLinearGradient(0, 0, W * .62, 0) : c.createLinearGradient(0, 0, 0, H); if (side === 'left') { g.addColorStop(0, `rgba(8,12,10,${a})`); g.addColorStop(1, 'rgba(8,12,10,0)'); } else { g.addColorStop(0, `rgba(8,12,10,${a})`); g.addColorStop(.45, 'rgba(8,12,10,0)'); g.addColorStop(.7, 'rgba(8,12,10,0)'); g.addColorStop(1, `rgba(8,12,10,${a})`); } c.fillStyle = g; c.fillRect(0, 0, W, H); }

// S1 — opening aerial
function s1(c, t) {
  const p = t / 10.6;
  land(c, { t, tod: .2, zoom: lerp(1.04, 1.24, eio(p)), fx: lerp(-60, 120, eio(p)), fy: lerp(-90, 60, eio(p)), pan: lerp(-160, 160, p), resort: ss(3.5, 8.5, t), mist: lerp(1, .5, p) });
  legibility(c, 'top', .35);
  rev(c, 'Денсаулығыңыз жай демалыстан да', W / 2, 250, { size: 74, align: 'center', shadow: 24 }, t, 2.2, 10.2, 1.6);
  rev(c, 'артық нәрсеге лайық.', W / 2, 340, { size: 74, align: 'center', italic: true, shadow: 24 }, t, 2.9, 10.2, 1.6);
}
// S2 — location
function s2(c, t) {
  const p = t / 10.6;
  land(c, { t: t + 10, tod: .30, zoom: lerp(1.85, 2.0, eio(p)), fx: 225 + lerp(-30, 40, p), fy: 140, pan: lerp(30, -40, p), resort: 1, mist: .35, fg: 0 });
  legibility(c, 'left', .72);
  rev(c, 'БАВАРИЯ  ·  ГЕРМАНИЯ', 140, 330, { font: SANS, size: 20, weight: 500, color: C.gold, track: 6 }, t, .6);
  rev(c, 'Lanserhof Tegernsee', 136, 430, { size: 104, weight: 300 }, t, 1.0);
  c.save(); c.globalAlpha = eo((t - 1.8) / 1.2); line(c, 140, 478, 140 + 420 * eo((t - 1.8) / 1.6), 478, C.gold, .8, 1.2); c.restore();
  rev(c, 'Тегернзе көлінің үстінде, Альпі етегінде', 140, 548, { size: 40, italic: true, color: C.cream }, t, 2.2);
  rev(c, 'Мюнхен әуежайынан ~90 км  ·  көлікпен шамамен 1 сағат', 140, 614, { font: SANS, size: 25, color: C.soft }, t, 3.2);
  rev(c, 'Әуежай мен вокзалдан трансфер — сұраныс бойынша', 140, 656, { font: SANS, size: 25, color: C.soft }, t, 3.8);
  rev(c, 'Gut Steinberg 1–4, 83666 Waakirchen', 140, 698, { font: SANS, size: 25, color: C.soft }, t, 4.4);
  rev(c, 'World’s Best Medical Spa 2025  ·  21 000 м²  ·  18 шұңқырлы гольф алаңы', 140, 800, { font: SANS, size: 19, weight: 500, color: C.gold, track: 2 }, t, 5.4);
  // mini route card
  const a = eo((t - 3) / 1.2); if (a > 0) {
    c.save(); c.globalAlpha = a; const x0 = 1300, y0 = 860, x1 = 1760, y1 = 800;
    c.fillStyle = 'rgba(12,18,16,.45)'; c.beginPath(); c.roundRect(1250, 730, 580, 190, 18); c.fill(); c.strokeStyle = 'rgba(242,237,228,.18)'; c.stroke();
    const k = eo((t - 3.4) / 2.2); c.setLineDash([8, 10]); line(c, x0, y0, lerp(x0, x1, k), lerp(y0, y1, k), C.cream, .7, 2); c.setLineDash([]);
    c.fillStyle = C.cream; c.beginPath(); c.arc(x0, y0, 6, 0, 7); c.fill(); c.fillStyle = C.gold; c.beginPath(); c.arc(x1, y1, 7 * k, 0, 7); c.fill();
    txt(c, 'MUC · Мюнхен', x0 - 8, y0 + 40, { font: SANS, size: 19, color: C.soft }); txt(c, 'Lanserhof', x1 + 8, y1 - 22, { font: SANS, size: 19, color: C.cream, align: 'right' });
    txt(c, '≈ 90 км', (x0 + x1) / 2, (y0 + y1) / 2 - 18, { size: 30, italic: true, color: C.gold, align: 'center' });
    c.restore();
  }
}
// S3 — medical excellence
function s3(c, t) {
  let g = c.createRadialGradient(W * .66, H * .5, 0, W * .66, H * .5, W * .7); g.addColorStop(0, '#1D2B26'); g.addColorStop(1, '#090E0C'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const cx = 1230, cy = 500, intro = eo(t / 2);
  c.save(); c.translate(cx, cy); c.scale(lerp(.92, 1.04, t / 12.6), lerp(.92, 1.04, t / 12.6));
  for (let i = 0; i < 6; i++) { const r = 120 + i * 62; c.save(); c.globalAlpha = intro * (.10 + .05 * (i % 2)); c.strokeStyle = C.cream; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke(); c.restore();
    c.save(); c.rotate(t * (.08 + i * .025) * (i % 2 ? -1 : 1) + i); c.globalAlpha = intro * .55; c.strokeStyle = C.gold; c.lineWidth = 1.6; c.beginPath(); c.arc(0, 0, r, 0, .5 + i * .12); c.stroke(); c.restore(); }
  c.restore();
  // HRV / ECG trace
  const yb = 900, prog = eo((t - .5) / 9) * (W + 100);
  c.save(); c.strokeStyle = C.gold; c.lineWidth = 2; c.shadowColor = 'rgba(201,180,138,.8)'; c.shadowBlur = 10; c.beginPath();
